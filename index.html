<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>聖誕禮物劃刀大挑戰</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      width: 100vw;
      height: 100vh;
      background: #0b1320;
      color: #f8fafc;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
    }

    /* 橫版 16:9 自適應主容器 */
    #gameContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 177.78vh;
      max-height: 56.25vw;
      background: linear-gradient(180deg, #0f2038 0%, #1b365d 65%, #244775 100%);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
      overflow: hidden;
    }

    canvas#gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    /* 頂部狀態列 */
    #hud {
      position: absolute;
      top: 12px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
    }
    .hud-group {
      display: flex;
      gap: 16px;
      font-size: 16px;
      font-weight: bold;
    }
    .score-box { color: #fde68a; }
    .combo-box { color: #86efac; }
    .lives-box { color: #fca5a5; }

    /* 開始 / 結束覆蓋層 */
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 17, 30, 0.82);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      z-index: 20;
    }
    #overlay h1 {
      font-size: 28px;
      color: #fde68a;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }
    #overlay p {
      font-size: 14.5px;
      line-height: 1.65;
      color: #e2e8f0;
      max-width: 540px;
      margin-bottom: 18px;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .legend span {
      background: rgba(255, 255, 255, 0.1);
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    #startBtn {
      background: linear-gradient(135deg, #e11d48, #be123c);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 28px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(225, 29, 72, 0.45);
    }
    #startBtn:active { transform: scale(0.96); }

    /* 直立螢幕提示 */
    #rotateTip {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(9, 17, 30, 0.96);
      z-index: 99;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      gap: 10px;
    }
    @media (orientation: portrait) and (max-width: 900px) {
      #rotateTip { display: flex; }
    }
  </style>
</head>
<body>

  <div id="rotateTip">
    <div style="font-size: 42px;">↻</div>
    <p style="font-size: 16px; line-height: 1.6;">
      <strong>請將手機轉為橫向</strong><br>
      橫向寬螢幕最適合劃開飛舞的聖誕禮物！
    </p>
  </div>

  <div id="gameContainer">
    <div id="hud">
      <div class="hud-group">
        <div class="score-box">接收禮物得分：<span id="scoreVal">0</span></div>
        <div class="combo-box" id="comboVal"></div>
      </div>
      <div class="hud-group">
        <div class="lives-box">漏接機會：<span id="livesVal">3</span></div>
      </div>
    </div>

    <canvas id="gameCanvas" width="960" height="540"></canvas>

    <div id="overlay">
      <h1 id="overlayTitle">🎄 聖誕禮物劃刀大挑戰 🎄</h1>
      <p id="overlayDesc">
        按住滑鼠或用手指在畫面上<strong>快速劃過</strong>飛出的聖誕禮物來接收它們！<br>
        禮物掉出畫面下方會扣一次漏接機會；<strong>千萬不要劃到聖誕老公公或炸彈</strong>！
      </p>
      <div class="legend">
        <span>🎁 紅/金/綠禮物（+10分）</span>
        <span>🎅 聖誕老公公（不可劃到，劃到直接結束！）</span>
        <span>💣 炸彈（不可劃到，劃到扣生命並結束！）</span>
      </div>
      <button id="startBtn">開始接收禮物</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('scoreVal');
    const comboVal = document.getElementById('comboVal');
    const livesVal = document.getElementById('livesVal');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayDesc = document.getElementById('overlayDesc');
    const startBtn = document.getElementById('startBtn');

    let running = false;
    let score = 0;
    let lives = 3;
    let combo = 0;
    let lastCollectTime = 0;
    let spawnTimer = 0;

    let entities = [];      // 禮物、聖誕老公公、炸彈
    let particles = [];     // 接收禮物或爆炸的粒子特效
    let floatingTexts = []; // 得分/警示浮動文字
    let bladeTrail = [];    // 刀光軌跡點
    let isSlashing = false;

    // 背景雪花
    const snows = Array.from({ length: 45 }, () => ({
      x: Math.random() * 960,
      y: Math.random() * 540,
      r: 1.5 + Math.random() * 2.5,
      speed: 0.8 + Math.random() * 1.4,
      drift: (Math.random() - 0.5) * 0.6
    }));

    const giftStyles = [
      { box: '#e11d48', ribbon: '#fde047', label: '🎁' },
      { box: '#16a34a', ribbon: '#fef08a', label: '🎀' },
      { box: '#d97706', ribbon: '#fffbeb', label: '✨' }
    ];

    function getCanvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches && e.touches.length ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches && e.touches.length ? e.touches[0].clientY : e.clientY;
      return {
        x: ((clientX - rect.left) / rect.width) * canvas.width,
        y: ((clientY - rect.top) / rect.height) * canvas.height
      };
    }

    function addSlashPoint(x, y) {
      bladeTrail.push({ x, y, life: 1.0 });
      if (bladeTrail.length > 14) bladeTrail.shift();
    }

    function startGame() {
      score = 0;
      lives = 3;
      combo = 0;
      entities = [];
      particles = [];
      floatingTexts = [];
      bladeTrail = [];
      spawnTimer = 25;
      running = true;

      scoreVal.textContent = '0';
      livesVal.textContent = '3';
      comboVal.textContent = '';
      overlay.style.display = 'none';
      requestAnimationFrame(loop);
    }

    function endGame(reasonTitle, reasonText) {
      running = false;
      overlayTitle.textContent = reasonTitle;
      overlayDesc.innerHTML = `${reasonText}<br>本次最終得分：<strong>${score}</strong> 分`;
      startBtn.textContent = '再玩一次';
      overlay.style.display = 'flex';
    }

    // 產生拋物線物件（橫向寬畫面：可從下方或左右側斜向拋出）
    function spawnWave() {
      const count = 1 + Math.floor(Math.random() * 3); // 每次拋出 1~3 個
      for (let i = 0; i < count; i++) {
        const roll = Math.random();
        let type = 'gift';
        if (roll < 0.16) type = 'santa';
        else if (roll < 0.34) type = 'bomb';

        const fromSide = Math.random() < 0.35;
        let x, y, vx, vy;

        if (!fromSide) {
          // 從底部往上拋
          x = 140 + Math.random() * (canvas.width - 280);
          y = canvas.height + 30;
          vx = (canvas.width / 2 - x) * (0.0022 + Math.random() * 0.0025) + (Math.random() - 0.5) * 2.2;
          vy = -(10.5 + Math.random() * 3.8);
        } else if (Math.random() < 0.5) {
          // 從左側往右上方拋入
          x = -25;
          y = 260 + Math.random() * 180;
          vx = 4.5 + Math.random() * 3.2;
          vy = -(8.5 + Math.random() * 3.0);
        } else {
          // 從右側往左上方拋入
          x = canvas.width + 25;
          y = 260 + Math.random() * 180;
          vx = -(4.5 + Math.random() * 3.2);
          vy = -(8.5 + Math.random() * 3.0);
        }

        const style = giftStyles[Math.floor(Math.random() * giftStyles.length)];
        entities.push({
          type,
          x,
          y,
          vx,
          vy,
          radius: type === 'gift' ? 28 : 30,
          gravity: 0.22,
          angle: 0,
          rotSpeed: (Math.random() - 0.5) * 0.08,
          style,
          collected: false
        });
      }
    }

    // 線段到圓心距離（判斷刀光是否劃到物件）
    function distToSegment(px, py, x1, y1, x2, y2) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const lenSq = dx * dx + dy * dy;
      let t = lenSq === 0 ? 0 : ((px - x1) * dx + (py - y1) * dy) / lenSq;
      t = Math.max(0, Math.min(1, t));
      const nearX = x1 + t * dx;
      const nearY = y1 + t * dy;
      return Math.hypot(px - nearX, py - nearY);
    }

    function checkSlashHit(x1, y1, x2, y2) {
      if (!running) return;

      for (let i = entities.length - 1; i >= 0; i--) {
        const ent = entities[i];
        if (ent.collected) continue;

        const d = distToSegment(ent.x, ent.y, x1, y1, x2, y2);
        if (d <= ent.radius + 10) {
          if (ent.type === 'gift') {
            ent.collected = true;
            const now = performance.now();
            if (now - lastCollectTime < 650) {
              combo += 1;
            } else {
              combo = 1;
            }
            lastCollectTime = now;

            const bonus = combo >= 3 ? combo * 5 : 0;
            const gained = 10 + bonus;
            score += gained;
            scoreVal.textContent = score;
            comboVal.textContent = combo >= 2 ? `連擊 x${combo}！` : '';

            spawnBurst(ent.x, ent.y, ent.style.ribbon, 14);
            floatingTexts.push({
              x: ent.x,
              y: ent.y,
              text: bonus > 0 ? `+${gained} (連擊!)` : `+${gained}`,
              color: '#fde047',
              life: 1.0
            });
            entities.splice(i, 1);
          } else if (ent.type === 'santa') {
            spawnBurst(ent.x, ent.y, '#f87171', 22);
            endGame(
              '🎅 哎呀！劃到聖誕老公公了！',
              '聖誕老公公正在發禮物，不能劃到他喔！'
            );
            return;
          } else if (ent.type === 'bomb') {
            spawnBurst(ent.x, ent.y, '#fb923c', 26);
            endGame(
              '💣 轟！劃到炸彈啦！',
              '小心避開炸彈，下次只劃聖誕禮物就好！'
            );
            return;
          }
        }
      }
    }

    function spawnBurst(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
        const speed = 2 + Math.random() * 5;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          r: 3 + Math.random() * 4,
          color,
          life: 1.0
        });
      }
    }

    function drawEntity(ent) {
      ctx.save();
      ctx.translate(ent.x, ent.y);
      ctx.rotate(ent.angle);

      if (ent.type === 'gift') {
        // 禮物盒身
        ctx.fillStyle = ent.style.box;
        ctx.beginPath();
        ctx.roundRect(-24, -22, 48, 46, 7);
        ctx.fill();

        // 緞帶十字
        ctx.fillStyle = ent.style.ribbon;
        ctx.fillRect(-5, -22, 10, 46);
        ctx.fillRect(-24, -4, 48, 9);

        // 禮物盒蓋
        ctx.fillStyle = ent.style.box;
        ctx.beginPath();
        ctx.roundRect(-27, -27, 54, 11, 4);
        ctx.fill();
        ctx.fillStyle = ent.style.ribbon;
        ctx.fillRect(-5, -27, 10, 11);
      } else if (ent.type === 'santa') {
        // 聖誕老公公（紅帽＋白鬍子＋警示光環）
        ctx.strokeStyle = 'rgba(248, 113, 113, 0.7)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 0, ent.radius + 4, 0, Math.PI * 2);
        ctx.stroke();

        // 臉部
        ctx.fillStyle = '#fde68a';
        ctx.beginPath();
        ctx.arc(0, 3, 17, 0, Math.PI * 2);
        ctx.fill();

        // 白鬍子
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, 13, 14, 0, Math.PI);
        ctx.fill();

        // 聖誕帽
        ctx.fillStyle = '#dc2626';
        ctx.beginPath();
        ctx.moveTo(-18, -4);
        ctx.lineTo(0, -28);
        ctx.lineTo(18, -4);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, -28, 5, 0, Math.PI * 2);
        ctx.fill();
      } else if (ent.type === 'bomb') {
        // 炸彈本體
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.arc(0, 4, 24, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 引信與火花
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, -20);
        ctx.quadraticCurveTo(10, -30, 16, -24);
        ctx.stroke();

        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.arc(16, -24, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#f87171';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('✕', 0, 5);
      }

      ctx.restore();
    }

    function loop(now) {
      if (!running) return;

      if (now && now - lastCollectTime >= 650 && combo > 0) {
        combo = 0;
        comboVal.textContent = '';
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 背景雪花
      ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
      for (const s of snows) {
        s.y += s.speed;
        s.x += s.drift;
        if (s.y > canvas.height) { s.y = -5; s.x = Math.random() * canvas.width; }
        if (s.x < 0) s.x = canvas.width;
        if (s.x > canvas.width) s.x = 0;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // 產生新一波物件
      spawnTimer++;
      if (spawnTimer >= 95) {
        spawnWave();
        spawnTimer = 0;
      }

      // 更新與繪製物件
      for (let i = entities.length - 1; i >= 0; i--) {
        const ent = entities[i];
        ent.x += ent.vx;
        ent.y += ent.vy;
        ent.vy += ent.gravity;
        ent.angle += ent.rotSpeed;

        drawEntity(ent);

        // 掉出畫面下方
        if (ent.y > canvas.height + 50) {
          if (ent.type === 'gift') {
            lives -= 1;
            livesVal.textContent = Math.max(0, lives);
            combo = 0;
            comboVal.textContent = '';
            floatingTexts.push({
              x: Math.max(60, Math.min(canvas.width - 60, ent.x)),
              y: canvas.height - 30,
              text: '漏接禮物 -1 機會',
              color: '#fca5a5',
              life: 1.0
            });
            if (lives <= 0) {
              entities.splice(i, 1);
              endGame(
                '🎁 漏接次數用完囉！',
                '差一點就能把更多聖誕禮物收進袋子了！'
              );
              return;
            }
          }
          entities.splice(i, 1);
        }
      }

      // 粒子特效
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.life -= 0.03;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      // 浮動文字
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y -= 1.2;
        ft.life -= 0.022;
        if (ft.life <= 0) { floatingTexts.splice(i, 1); continue; }
        ctx.globalAlpha = Math.max(0, ft.life);
        ctx.fillStyle = ft.color;
        ctx.font = 'bold 18px "PingFang TC", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.globalAlpha = 1;
      }

      // 刀光軌跡
      if (bladeTrail.length > 1) {
        for (let i = 1; i < bladeTrail.length; i++) {
          const prev = bladeTrail[i - 1];
          const curr = bladeTrail[i];
          curr.life -= 0.12;
          ctx.strokeStyle = `rgba(125, 211, 252, ${Math.max(0, curr.life)})`;
          ctx.lineWidth = Math.max(2, (i / bladeTrail.length) * 8);
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(prev.x, prev.y);
          ctx.lineTo(curr.x, curr.y);
          ctx.stroke();
        }
        bladeTrail = bladeTrail.filter(pt => pt.life > 0);
      }

      requestAnimationFrame(loop);
    }

    // 滑鼠劃刀
    canvas.addEventListener('mousedown', e => {
      isSlashing = true;
      bladeTrail = [];
      const pos = getCanvasPos(e);
      addSlashPoint(pos.x, pos.y);
    });
    window.addEventListener('mousemove', e => {
      if (!isSlashing) return;
      const pos = getCanvasPos(e);
      const prev = bladeTrail[bladeTrail.length - 1] || pos;
      addSlashPoint(pos.x, pos.y);
      checkSlashHit(prev.x, prev.y, pos.x, pos.y);
    });
    window.addEventListener('mouseup', () => { isSlashing = false; });

    // 手機觸控劃刀
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      isSlashing = true;
      bladeTrail = [];
      const pos = getCanvasPos(e);
      addSlashPoint(pos.x, pos.y);
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      if (!isSlashing) return;
      const pos = getCanvasPos(e);
      const prev = bladeTrail[bladeTrail.length - 1] || pos;
      addSlashPoint(pos.x, pos.y);
      checkSlashHit(prev.x, prev.y, pos.x, pos.y);
    }, { passive: false });

    window.addEventListener('touchend', () => { isSlashing = false; });

    startBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
